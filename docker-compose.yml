version: "3.9"

services:
  db:
    # pgvector/pgvector:pg15 = Postgres 15 with pgvector pre-installed
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: shopos
      POSTGRES_USER: shopos
      POSTGRES_PASSWORD: shopos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    # Alpine = minimal image, ~30MB vs 100MB+ for full redis
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  # Named volume — data survives `docker compose restart`, lost on `docker compose down -v`
  pgdata:
